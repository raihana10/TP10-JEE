<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Ajouter un Produit</title>
</h:head>
<h:body>
    <h:form id="addForm">
        <p:panel header="Ajouter un nouveau Produit">

            <p:growl id="msgs" showDetail="true"/>

            <h:panelGrid columns="2" cellpadding="8">

                <h:outputLabel for="name" value="Nom du produit :"/>
                <p:inputText id="name"
                             value="#{produitBean.produit.name}"
                             required="true"
                             requiredMessage="Le nom est obligatoire"/>

                <h:outputLabel for="price" value="Prix :"/>
                <p:inputText id="price"
                             value="#{produitBean.produit.price}"
                             required="true"
                             requiredMessage="Le prix est obligatoire"/>

            </h:panelGrid>

            <br/>
            <p:commandButton value="Enregistrer"
                             action="#{produitBean.save}"
                             update="addForm"
                             icon="pi pi-save"/>

            <p:button value="Retour à la liste"
                      outcome="listeProduit"
                      icon="pi pi-arrow-left"/>
        </p:panel>
    </h:form>
</h:body>
</html>
